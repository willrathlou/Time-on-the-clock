<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<main>
  <div class="clock" id="clock" aria-live="off">00:00:00</div>
  <p class="date" id="dateEl"></p>

  <div class="actions">
    <button id="btnIn" type="button">Clock in</button>
    <button id="btnOut" type="button" disabled>Clock out</button>
    <button id="reset" type="button">Reset</button>
  </div>

  <div class="times">
    <div><label for="start">Start time</label><input type="time" id="start"></div>
    <div><label for="end">Leave time</label><input type="time" id="end"></div>
  </div>

  <section class="pay">
    <h2>Earnings</h2>
    <div class="wagerow">
      <div><label for="wage">Your wage per month (£)</label><input type="number" id="wage" min="0" step="0.01" inputmode="decimal" placeholder="2000"></div>
      <div><label for="hpw">Hours per week</label><input type="number" id="hpw" min="1" max="168" step="0.5" value="37.5"></div>
    </div>
    
    <div class="wagebtns"><button id="wSave" type="button">Save wage</button><button id="wLoad" type="button">Load wage</button><button id="wReset" type="button">Reset wage</button></div>
    <div id="wageMsg" aria-live="polite"></div>
    <div style="margin-bottom:12px"><label for="payday">Payday (moves to the Friday before if it falls on a weekend)</label><select id="payday"></select></div>
    <div class="earned" id="earned">£0.00</div>
    <div id="earnedNote" style="color:var(--muted)">Enter your wage to see your earnings.</div>
    <ul class="stats">
      <li><span>Per hour</span><b id="sHour">–</b></li>
      <li><span>Per minute</span><b id="sMin">–</b></li>
      <li><span>Per second</span><b id="sSec">–</b></li>
      <li><span>You earn 1p every</span><b id="sPenny">–</b></li>
      <li><span>Last payday</span><b id="sLast">–</b></li>
      <li><span>Next payday</span><b id="sNext">–</b></li>
      <li><span>Earned this month so far</span><b id="sMonth">–</b></li>
    </ul>
  </section>

  <div class="status" id="status" aria-live="polite"><p>Not clocked in. Press Clock in, or enter your times above.</p></div>
</main>
<script src = "script.js" type="text/javascript"></script>
</body>
</html>
